replicaCount: 2   # used only when autoscaling.enabled=false

image:
  repository: orders-api
  tag: ""          # empty = appVersion from Chart.yaml
  pullPolicy: IfNotPresent

# The database URL is read from an existing Secret; the chart does not create one,
# so the password never ends up in values or in the Helm release history
database:
  existingSecret: orders-db
  urlKey: DATABASE_URL

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: traefik
  host: orders.demo.local
  path: /

resources:
  requests:
    cpu: 100m        # HPA computes CPU utilization relative to requests
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  # liveness: the process is alive. It does not check the DB, otherwise a DB outage would restart every pod
  liveness:
    path: /healthz
    periodSeconds: 10
    failureThreshold: 3
  # readiness: the pod can serve traffic (the DB connection works)
  readiness:
    path: /readyz
    periodSeconds: 5
    failureThreshold: 2
  # startup: gives the app time to start; liveness is not checked until it passes
  startup:
    path: /healthz
    periodSeconds: 2
    failureThreshold: 30

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

podDisruptionBudget:
  minAvailable: 1
