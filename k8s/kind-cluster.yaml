# Локальный кластер: 1 control plane + 2 worker.
# Порт 30080 (NodePort Ingress-контроллера) пробрасывается на хост как 8081.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: demo
networking:
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8081
        protocol: TCP
  - role: worker
  - role: worker
