name: CI/CD - Kubernetes Flask

on:
  push:
    branches: [main]
    paths:
      - "devops/kubernetes-flask/**"
      - ".github/workflows/ci-kubernetes-flask.yml"

  pull_request:
    branches: [main]
    paths:
      - "devops/kubernetes-flask/**"
      - ".github/workflows/ci-kubernetes-flask.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/owlildrownit-dev/devops-portfolio-kubernetes-flask

jobs:
  docker-build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t kubernetes-flask:ci \
            ./devops/kubernetes-flask

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag kubernetes-flask:ci "${IMAGE}:latest"
          docker tag kubernetes-flask:ci "${IMAGE}:sha-${GITHUB_SHA}"

          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:sha-${GITHUB_SHA}"
