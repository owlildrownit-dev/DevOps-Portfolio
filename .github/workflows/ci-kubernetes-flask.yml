name: CI - Kubernetes Flask

on:
  push:
    branches: [main]
    paths:
      - "devops/kubernetes-flask/**"
      - ".github/workflows/ci-kubernetes-flask.yml"

  pull_request:
    branches: [main]
    paths:
      - "devops/kubernetes-flask/**"
      - ".github/workflows/ci-kubernetes-flask.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t kubernetes-flask:ci ./devops/kubernetes-flask
