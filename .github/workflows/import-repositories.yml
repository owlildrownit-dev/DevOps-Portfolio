
name: Import portfolio repositories

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview or publish"
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply
      confirmation:
        description: "For apply enter IMPORT-6-REPOS"
        type: string
        required: false

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODE: ${{ inputs.mode }}
      CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and import
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Run only on main"
            exit 1
          fi

          if [[ "$MODE" == apply && "$CONFIRMATION" != IMPORT-6-REPOS ]]; then
            echo "Confirmation required"
            exit 1
          fi

          if [[ -e devops || -e projects ]]; then
            echo "Target directories already exist"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for repo in stendemo demopipeline devops-labs DevOps-Test RailControl PR_PRACTIC; do
            tags="$(git ls-remote --tags --refs "https://github.com/owlildrownit-dev/$repo.git")"
            if [[ -n "$tags" ]]; then
              echo "Tags found in $repo; migration needs review"
              exit 1
            fi
          done

          import_repo() {
            git remote add "$1" "https://github.com/owlildrownit-dev/$2.git"
            git fetch --no-tags "$1"
            git subtree add --prefix="$4" "$1/$3"
            git merge-base --is-ancestor "$1/$3" HEAD
          }

          import_repo orders stendemo main devops/orders-platform
          import_repo pipeline demopipeline main devops/ci-cd-demo
          import_repo k8stest DevOps-Test main devops/kubernetes-flask
          import_repo labs devops-labs master devops/labs
          import_repo rail RailControl main projects/rail-control
          import_repo detector PR_PRACTIC main projects/red-light-detector

          git branch archive/demopipeline-failing-test pipeline/test/failing-test

          git diff --check
          test -z "$(git status --porcelain)"

          if [[ "$MODE" == plan ]]; then
            echo "PLAN OK — nothing published"
          else
            git push --atomic origin \
              HEAD:refs/heads/main \
              refs/heads/archive/demopipeline-failing-test:refs/heads/archive/demopipeline-failing-test
          fi
