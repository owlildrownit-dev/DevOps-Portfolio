name: CI - Demo Pipeline

on:
  push:
    branches: [main]
    paths:
      - "devops/ci-cd-demo/**"
      - ".github/workflows/ci-demo.yml"

  pull_request:
    branches: [main]
    paths:
      - "devops/ci-cd-demo/**"
      - ".github/workflows/ci-demo.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: devops/ci-cd-demo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: devops/ci-cd-demo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build application
        run: npm run build
