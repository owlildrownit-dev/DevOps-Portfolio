# Полная выкладка: миграция БД -> сборка образа -> rolling update приложения
# -> конфигурация балансировщика -> smoke-тест.
- name: Deploy orders-api
  hosts: localhost
  gather_facts: false

  pre_tasks:
    - name: Check required variables
      ansible.builtin.assert:
        that:
          - db_password | length > 0
          - docker_network is defined
        fail_msg: >-
          Нет DB_PASSWORD в окружении или не сгенерирован terraform.yml.
          Запускайте через ../deploy.sh

  roles:
    - db_migrate
    - app
    - lb
    - smoke_test
