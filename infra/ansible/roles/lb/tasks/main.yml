- name: Create directory for rendered configs
  ansible.builtin.file:
    path: "{{ playbook_dir }}/.rendered"
    state: directory
    mode: "0755"

- name: Render nginx config
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ playbook_dir }}/.rendered/nginx.conf"
    mode: "0644"
  register: nginx_conf

- name: Run load balancer
  community.docker.docker_container:
    name: "{{ stand_name }}-lb"
    image: "{{ lb_image }}"
    restart_policy: unless-stopped
    networks:
      - name: "{{ docker_network }}"
    published_ports:
      - "{{ lb_port }}:80"
    volumes:
      - "{{ playbook_dir }}/.rendered/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
    labels:
      stand: "{{ stand_name }}"
      managed: ansible
    # restart only when the config has changed
    restart: "{{ nginx_conf.changed }}"
    state: started
