# Build with BuildKit (the Dockerfile uses RUN --mount, which the legacy builder lacks)
- name: Build application image
  community.docker.docker_image_build:
    name: "{{ app_name }}"
    tag: "{{ app_version }}"
    path: "{{ app_src_dir }}"
    dockerfile: Dockerfile
    rebuild: always

# Rolling update: replicas are replaced one at a time, the next only after the previous one is healthy,
# so the load balancer always has at least one live replica
- name: Roll out replicas one by one
  ansible.builtin.include_tasks: replica.yml
  loop: "{{ range(1, app_replicas + 1) | list }}"
  loop_control:
    loop_var: replica_index
