# Network and DB container names come from terraform.yml, generated by Terraform
app_name: orders-api
app_version: "{{ lookup('env', 'APP_VERSION') | default('1.0.0', true) }}"
app_replicas: 2
app_port: 8000
app_src_dir: "{{ playbook_dir }}/../../app"

lb_port: 8080
lb_image: nginx:1.27-alpine

db_name: shop
db_user: shop
db_password: "{{ lookup('env', 'DB_PASSWORD') }}"
