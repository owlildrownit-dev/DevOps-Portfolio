# Deployment settings. Infrastructure parameters (network, DB container name)
# come from terraform.yml, which Terraform generates.
app_name: orders-api
app_version: "{{ lookup('env', 'APP_VERSION') | default('1.0.0', true) }}"
app_replicas: 2
app_port: 8000
app_src_dir: "{{ playbook_dir }}/../../app"

lb_port: 8080
lb_image: nginx:1.27-alpine

db_name: shop
db_user: shop
# The password comes only from the environment and is not stored in the repository
db_password: "{{ lookup('env', 'DB_PASSWORD') }}"
